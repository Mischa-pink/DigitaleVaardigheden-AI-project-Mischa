<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Games — Minecraft (EaglerCraft)</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <style>
        /* 16:9 aspect ratio for Minecraft window */
        .minecraft-frame {
            position: relative;
            width: 100%;
            max-width: 1100px; /* adjust if you want bigger or smaller */
            margin: 0 auto;
            padding-top: 56.25%; /* 16:9 ratio */
        }

        .minecraft-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

<header class="game-header">
    <img src="logo.png" alt="Pink Games Logo" class="logo">
</header>

<div class="hamburger-menu" onclick="toggleMenu()">
    <div></div>
    <div></div>
    <div></div>
</div>

<div id="popupMenu" class="popup-menu">
    <a href="index.html">Home</a>
    <a href="game1.html">Random Basket</a>
    <a href="game2.html">Sans Fight</a>
    <a href="game3.html">Cluster Rush</a>
    <a href="game4.html">Slope</a>
    <a href="game5.html">Minecraft</a>
</div>

<div class="back-menu-container">
    <a href="index.html" class="back-menu-btn">Main Menu</a>
</div>

<main class="game-page">
    <h2 class="game-title">Minecraft (EaglerCraft)</h2>

    <div class="minecraft-frame">
        <iframe
                src="minecraft/index.html"
                allowfullscreen>
        </iframe>
    </div>

    <div class="fullscreen-container">
        <button class="fullscreen-btn" onclick="openMinecraftFullscreen()">Fullscreen</button>
    </div>
</main>


<footer>
    <p>© 2026 Pink Games — Created with AI</p>
</footer>

</body>
</html>
