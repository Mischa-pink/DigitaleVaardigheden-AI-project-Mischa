<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Games — There Is No Game</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <style>
        /* Safe centering that won't override your site */
        .game-center-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .game-frame {
            position: relative;
            width: 100%;
            max-width: 1100px;
            padding-top: 56.25%; /* 16:9 */
            border-radius: 20px;
            overflow: hidden;
            background: var(--pink-light);
            border: 3px solid var(--pink-dark);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .game-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 20px;
        }

        .fullscreen-container {
            margin-top: 10px;
            text-align: center;
        }

        .fullscreen-btn {
            border-radius: 12px;
        }
    </style>
</head>

<body>

<header class="game-header">
    <img src="logo.png" alt="Pink Games Logo" class="logo">
</header>

<div class="hamburger-menu" onclick="toggleMenu()">
    <div></div>
    <div></div>
    <div></div>
</div>

<div id="popupMenu" class="popup-menu">
    <a href="index.html">Home</a>
    <a href="game1.html">Random Basket</a>
    <a href="game2.html">Sans Fight</a>
    <a href="game3.html">Cluster Rush</a>
    <a href="game4.html">Slope</a>
    <a href="game5.html">Minecraft</a>
    <a href="game6.html">There Is No Game</a>
</div>

<div class="back-menu-container">
    <a href="index.html" class="back-menu-btn">Main Menu</a>
</div>

<main class="game-page">
    <h2 class="game-title">There Is No Game</h2>

    <!-- SAFE CENTER WRAPPER -->
    <div class="game-center-wrapper">
        <div class="game-frame">
            <iframe src="thereisnogame/index.html"></iframe>
        </div>
    </div>

    <div class="fullscreen-container">
        <button class="fullscreen-btn" onclick="window.open('thereisnogame/index.html', '_blank')">
            Fullscreen
        </button>
    </div>
</main>

<footer>
    <p>© 2026 Pink Games — Created with AI</p>
</footer>

</body>
</html>
